<!-- Enlace temporary transfer -->
<!doctype html>
<html lang="es">
<head>
 <meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src https://pjaszmbselyhtvuhaegx.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <meta name="theme-color" content="#000000">
 <meta name="description" content="Comparte un archivo con un enlace temporal.">
 <title>Enlace</title>
 <link rel="icon" href="./favicon.svg?v=c2094cdf1acc9636" type="image/svg+xml">
 <link rel="stylesheet" href="./style.css?v=e6c07235e099e7b1">
 <script src="./app.js?v=376a89be1b3c369e" defer></script>
</head>
<body>
 <main>
  <section id="send-view" class="view" aria-labelledby="send-title">
   <div class="view-heading">
    <h1 id="send-title">Enviar</h1>
    <p class="note">500 MB · 24 h</p>
   </div>
   <div class="space-row"><span>Espacio</span><span id="space-available">—</span></div>
   <div id="drop-zone" class="drop-zone">
    <button id="choose-file" class="button secondary" type="button">Elegir archivo</button>
   </div>
   <div id="selected-file" class="file-row" hidden>
    <div class="file-details"><strong id="selected-name"></strong><span id="selected-size"></span></div>
    <button id="clear-file" class="icon-button" type="button" aria-label="Quitar archivo">×</button>
   </div>
   <div id="options">
    <label class="sr-only" for="pin">PIN opcional, de 6 a 12 números</label>
    <input id="pin" class="pin-input" name="transfer-code" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="PIN (opcional)" data-1p-ignore data-lpignore="true" data-bwignore>
   </div>
   <p id="send-error" class="error" role="alert"></p>
   <button id="send-button" class="button primary" type="button" disabled>Crear enlace</button>
   <section id="history" class="history" aria-labelledby="history-title" hidden>
    <div class="history-heading"><h2 id="history-title">Archivos</h2><span id="history-scope">Este navegador</span></div>
    <ul id="history-list"></ul>
   </section>
  </section>

  <section id="progress-view" class="view" aria-live="polite" hidden>
   <h1 id="progress-title">Preparando…</h1>
   <p id="progress-description" class="sr-only"></p>
   <div class="progress-track"><span id="progress-bar"></span></div>
   <div class="progress-info"><span id="progress-percent"></span><span id="progress-size"></span></div>
  </section>

  <section id="result-view" class="view" aria-labelledby="result-title" hidden>
   <h1 id="result-title">Listo</h1>
   <div class="file-details"><strong id="result-name"></strong><span id="result-size"></span></div>
   <label class="sr-only" for="share-link">Enlace para compartir</label>
   <div class="link-box">
    <input id="share-link" type="text" readonly autocomplete="off" spellcheck="false">
    <button id="copy-link" class="button primary" type="button">Copiar</button>
   </div>
   <p id="expiration-text" class="note"></p>
   <button id="new-upload" class="button secondary" type="button">Otro archivo</button>
   <button id="delete-upload" class="text-button" type="button">Eliminar</button>
   <p id="result-error" class="error" role="alert"></p>
  </section>

  <section id="receive-view" class="view" aria-labelledby="receive-title" hidden>
   <h1 id="receive-title">Archivo</h1>
   <p id="receive-description" class="sr-only"></p>
   <form id="pin-form" autocomplete="off" hidden>
    <label class="sr-only" for="receive-pin">PIN del archivo</label>
    <input id="receive-pin" class="pin-input" name="access-code" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="PIN" data-1p-ignore data-lpignore="true" data-bwignore required>
    <button class="button primary" type="submit">Descargar</button>
   </form>
   <div id="receive-file" class="file-details" hidden><strong id="receive-name"></strong><span id="receive-size"></span></div>
   <div id="receive-progress" hidden>
    <div class="progress-track"><span id="download-bar"></span></div>
    <div class="progress-info"><span id="download-percent"></span><span id="download-size"></span></div>
   </div>
   <p id="receive-error" class="error" role="alert"></p>
   <button id="download-again" class="button primary" type="button" hidden>Descargar</button>
   <button id="send-my-file" class="button secondary" type="button">Enviar archivo</button>
  </section>
  <p id="setup-notice" class="setup-notice" role="status" hidden>No disponible</p>
 </main>
 <input id="file-input" type="file" hidden>
 <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
